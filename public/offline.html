<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1f7a4d">
  <link rel="icon" type="image/png" sizes="32x32" href="/ani-mart/public/assets/img/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/ani-mart/public/assets/img/apple-touch-icon.png">
  <title>Ani-Mart — Offline</title>
  <style>
    body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f7faf7;color:#17211b;display:grid;min-height:100vh;place-items:center;padding:24px}
    main{max-width:480px;text-align:center;background:#fff;border:1px solid #dbe7d5;border-radius:20px;padding:32px;box-shadow:0 12px 30px rgba(20,92,59,.08)}
    img{width:88px;height:88px;object-fit:contain}h1{margin:16px 0 8px}p{color:#667085;line-height:1.6}
    button{border:0;border-radius:999px;background:#1f7a4d;color:white;padding:12px 22px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <img src="/ani-mart/public/assets/img/ani-mart-logo.png" alt="Ani-Mart">
    <h1>You’re offline</h1>
    <p>Reconnect to view current products, stock, prices, messages, and orders.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
